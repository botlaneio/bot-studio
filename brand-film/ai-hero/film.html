<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Figtree; font-weight: 400; src: url(fonts/figtree-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Figtree; font-weight: 500; src: url(fonts/figtree-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Figtree; font-weight: 600; src: url(fonts/figtree-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: FMono; font-weight: 400; src: url(fonts/fragment-mono-latin-400-normal.woff2) format("woff2"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
/* BotLane Studios / AI Integrations hero loop. 10 s, 9:16, seamless.
   One idea: Lane's lens. It glances along its slot, leaves it to become the
   cursor of a visitor's question, scans the business's own content, lights
   the one source that answers, draws the answer out of it, then everything
   folds back into the lens and the slot reforms as on frame one.
   Palette from src/app/globals.css: black, white, cobalt #0077e6 (+ #3d9bff
   highlight used by Lane). Easing from --ease-out / --ease-rise.
   render(ctx, t) is pure: no clocks, so any frame re-renders alone. */

const W = 720, H = 1280, DUR = 10;
const CX = W / 2, CY = 640;
const COBALT = "#0077e6", BRIGHT = "#3d9bff";

// ── easing (cubic-bézier, the site's curves) ──
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = dx(t); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
}
const easeOut = bezier(0.2, 0.75, 0.2, 1);
const easeRise = bezier(0.29, 0.84, 0.56, 1);
const easeInOut = bezier(0.65, 0, 0.35, 1);
const easeIn = bezier(0.5, 0, 0.75, 0);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;

// ── beats (seconds) ──
const B = {
  glanceA: 0.15, glanceB: 0.85,      // lens slides left → right in the slot
  slotOutA: 0.95, slotOutB: 1.45,    // slot collapses into the lens
  riseA: 1.15, riseB: 1.9,           // lens rises to the question
  typeA: 1.6, typeB: 2.9,            // question types in
  cardsA: 2.9, cardsB: 3.9,          // content cards arrive from depth
  scanA: 3.6, scanB: 4.9,            // scan line sweeps the cards
  hit: 4.75,                          // the source lights
  lineA: 5.2, lineB: 6.0,            // line draws to the answer
  answerA: 5.7, answerB: 6.5,        // answer card arrives
  holdB: 7.6,                         // read time ends
  foldA: 7.6, foldB: 8.6,            // everything folds into the lens
  slotInA: 8.75, slotInB: 9.45,      // slot reforms around the lens
  homeA: 9.3, homeB: 9.95,           // lens returns to the left end
};

// Slot geometry (Lane mark proportions: 40 × 14 slot, lens r≈5).
const SLOT = { w: 260, h: 92 };
const LENS_R = 30;
const LEFT = CX - SLOT.w / 2 + SLOT.h / 2, RIGHT = CX + SLOT.w / 2 - SLOT.h / 2;

const QUESTION = ["Do you deliver", "on weekends?"];
const CARDS = [
  { title: "Delivery page", sub: "Weekend hours", hit: true },
  { title: "FAQ", sub: "12 answers" },
  { title: "Returns policy", sub: "30 days" },
  { title: "Product catalogue", sub: "84 items" },
];
// Card grid
const CARD_W = 290, CARD_H = 132, GAP = 20;
const GRID_TOP = 560;
function cardPos(i) {
  const col = i % 2, row = Math.floor(i / 2);
  return { x: CX - CARD_W - GAP / 2 + col * (CARD_W + GAP), y: GRID_TOP + row * (CARD_H + GAP) };
}
const ANSWER = { x: 70, y: 920, w: W - 140, h: 196 };

// ── drawing helpers ──
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function background(ctx, t) {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  // cobalt dawn, breathing on the loop period
  const breathe = 0.5 + 0.5 * Math.sin((t / DUR) * Math.PI * 2);
  let g = ctx.createRadialGradient(CX, 380, 0, CX, 380, 760);
  g.addColorStop(0, `rgba(0,119,230,${0.2 + 0.06 * breathe})`);
  g.addColorStop(1, "rgba(0,119,230,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // the site's dot grid, drifting one cell per loop so it repeats exactly
  const cell = 36, drift = (t / DUR) * cell;
  ctx.fillStyle = "rgba(255,255,255,0.075)";
  for (let y = -cell + (drift % cell); y < H + cell; y += cell)
    for (let x = cell / 2; x < W; x += cell) { ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); ctx.fill(); }
}

function lens(ctx, x, y, r, glow = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
  g.addColorStop(0, `rgba(160,205,255,${0.55 * glow})`);
  g.addColorStop(0.35, `rgba(61,155,255,${0.22 * glow})`);
  g.addColorStop(1, "rgba(0,119,230,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, Math.PI * 2); ctx.fill();
  const f = ctx.createRadialGradient(x - r * 0.32, y - r * 0.38, 0, x, y, r * 1.05);
  f.addColorStop(0, "#ffffff"); f.addColorStop(0.55, "#f6f5f1"); f.addColorStop(1, "#d9d8d2");
  ctx.fillStyle = f; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

function slot(ctx, w, h, alpha) {
  if (alpha <= 0 || w <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  // cobalt plate behind the slot, like the mark
  const pw = w + 70, ph = Math.max(h + 70, 0);
  rr(ctx, CX - pw / 2, CY - ph / 2, pw, ph, Math.min(46, ph / 2));
  const pg = ctx.createLinearGradient(0, CY - ph / 2, 0, CY + ph / 2);
  pg.addColorStop(0, "#3d9bff"); pg.addColorStop(0.55, "#0077e6"); pg.addColorStop(1, "#0058b0");
  ctx.fillStyle = pg; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2; ctx.stroke();
  rr(ctx, CX - w / 2, CY - h / 2, w, h, h / 2);
  const sg = ctx.createLinearGradient(0, CY - h / 2, 0, CY + h / 2);
  sg.addColorStop(0, "#08090a"); sg.addColorStop(0.62, "#15181c"); sg.addColorStop(1, "#2a2f36");
  ctx.fillStyle = sg; ctx.fill();
  ctx.restore();
}

function monoLabel(ctx, text, x, y, alpha, color = "rgba(255,255,255,0.6)", align = "left") {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align;
  ctx.font = "400 25px FMono"; ctx.fillText(text, x, y); ctx.restore();
}

// ── the scene ──
function render(ctx, t) {
  t = ((t % DUR) + DUR) % DUR;
  background(ctx, t);

  // Lens position over time
  let lx = LEFT, ly = CY, lr = LENS_R, lglow = 1;
  // glance
  lx = lerp(LEFT, RIGHT, easeInOut(prog(t, B.glanceA, B.glanceB)));
  // rise to just under the question
  const rise = easeRise(prog(t, B.riseA, B.riseB));
  const qY = 300; // question baseline area
  const cursorY = 470;
  lx = lerp(lx, CX, rise); ly = lerp(CY, cursorY, rise); lr = lerp(LENS_R, 14, rise);
  // fold back to the centre
  const fold = easeInOut(prog(t, B.foldA, B.foldB));
  lx = lerp(lx, CX, fold); ly = lerp(ly, CY, fold); lr = lerp(lr, LENS_R, fold);
  // home to the left end as the slot reforms
  lx = lerp(lx, LEFT, easeInOut(prog(t, B.homeA, B.homeB)));

  // Slot: present at start and end
  const out = easeIn(prog(t, B.slotOutA, B.slotOutB));
  const back = easeOut(prog(t, B.slotInA, B.slotInB));
  const slotK = t < 5 ? 1 - out : back;
  if (slotK > 0) slot(ctx, SLOT.w * slotK, SLOT.h * (0.4 + 0.6 * slotK), Math.min(1, slotK * 1.6));

  // Fold factor for the content layer: scale towards the centre and fade
  const layerA = 1 - fold;
  ctx.save();
  if (fold > 0) {
    const s = lerp(1, 0.2, fold);
    ctx.translate(CX, CY); ctx.scale(s, s); ctx.translate(-CX, -CY);
  }
  ctx.globalAlpha = layerA;

  // ── question ──
  const typeK = prog(t, B.typeA, B.typeB);
  if (typeK > 0 && layerA > 0) {
    monoLabel(ctx, "// A visitor asks", CX, 180, easeOut(prog(t, B.typeA - 0.2, B.typeA + 0.3)) * layerA, BRIGHT, "center");
    ctx.save(); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "500 64px Figtree";
    const total = QUESTION.join("").length;
    let n = Math.floor(typeK * total);
    const caretOn = Math.floor(t * 3) % 2 === 0;
    QUESTION.forEach((line, i) => {
      const shown = line.slice(0, Math.max(0, Math.min(line.length, n)));
      n -= line.length;
      ctx.fillText(shown, CX, 262 + i * 70);
    });
    ctx.restore();
  }

  // ── content cards from depth ──
  const scanK = easeInOut(prog(t, B.scanA, B.scanB));
  const hitK = easeOut(prog(t, B.hit, B.hit + 0.35));
  CARDS.forEach((c, i) => {
    const k = easeRise(prog(t, B.cardsA + i * 0.12, B.cardsA + 0.75 + i * 0.12));
    if (k <= 0) return;
    const p = cardPos(i);
    const s = lerp(0.55, 1, k);
    const cx = p.x + CARD_W / 2, cy = p.y + CARD_H / 2;
    ctx.save();
    ctx.globalAlpha = layerA * k * (c.hit ? 1 : lerp(1, 0.38, hitK));
    ctx.translate(cx, cy + (1 - k) * 90); ctx.scale(s, s); ctx.translate(-cx, -cy);
    rr(ctx, p.x, p.y, CARD_W, CARD_H, 20);
    const g = ctx.createLinearGradient(0, p.y, 0, p.y + CARD_H);
    g.addColorStop(0, c.hit ? `rgba(0,90,180,${0.25 + 0.3 * hitK})` : "#141820");
    g.addColorStop(1, "#0b0e12");
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = c.hit ? lerp(1.5, 3, hitK) : 1.5;
    ctx.strokeStyle = c.hit && hitK > 0 ? `rgba(61,155,255,${0.25 + 0.75 * hitK})` : "rgba(255,255,255,0.14)";
    ctx.stroke();
    if (c.hit && hitK > 0) { ctx.save(); ctx.shadowColor = "rgba(0,119,230,0.9)"; ctx.shadowBlur = 40 * hitK; ctx.stroke(); ctx.restore(); }
    // page lines icon
    ctx.fillStyle = c.hit && hitK > 0 ? BRIGHT : "rgba(255,255,255,0.35)";
    for (let l = 0; l < 3; l++) { rr(ctx, p.x + 24, p.y + 26 + l * 12, l === 2 ? 22 : 34, 5, 2.5); ctx.fill(); }
    ctx.fillStyle = "#fff"; ctx.font = "600 30px Figtree"; ctx.textAlign = "left";
    ctx.fillText(c.title, p.x + 24, p.y + 92);
    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "400 21px FMono";
    ctx.fillText(c.sub, p.x + 24, p.y + 118);
    ctx.restore();
  });

  // scan line: the lens drops a beam that sweeps the content
  if (scanK > 0 && scanK < 1 && layerA > 0) {
    const top = GRID_TOP - 20, bottom = GRID_TOP + 2 * CARD_H + GAP + 20;
    const y = lerp(top, bottom, scanK);
    const a = Math.sin(scanK * Math.PI);
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 2);
    g.addColorStop(0, "rgba(0,119,230,0)"); g.addColorStop(1, `rgba(61,155,255,${0.32 * a})`);
    ctx.fillStyle = g; ctx.fillRect(40, y - 60, W - 80, 62);
    ctx.fillStyle = `rgba(160,205,255,${0.95 * a})`; ctx.fillRect(40, y, W - 80, 2.5);
  }
  monoLabel(ctx, "// Your content", 70, GRID_TOP - 30, easeOut(prog(t, B.cardsA, B.cardsA + 0.5)) * layerA);
  monoLabel(ctx, "Source found", W - 70, GRID_TOP - 30, hitK * layerA, BRIGHT, "right");

  // line from the source to the answer
  const lineK = easeInOut(prog(t, B.lineA, B.lineB));
  if (lineK > 0 && layerA > 0) {
    const p = cardPos(0);
    // From the source card's left edge, down the left margin, into the answer.
    const x0 = p.x, y0 = p.y + CARD_H / 2;
    const x1 = ANSWER.x, y1 = ANSWER.y + 70;
    const mx = 34;
    ctx.save();
    ctx.strokeStyle = BRIGHT; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.shadowColor = "rgba(0,119,230,0.9)"; ctx.shadowBlur = 16;
    const pts = [];
    const steps = 60;
    for (let s = 0; s <= steps; s++) {
      const u = s / steps;
      const bx = (1 - u) ** 3 * x0 + 3 * (1 - u) ** 2 * u * (mx - 10) + 3 * (1 - u) * u * u * (mx - 10) + u ** 3 * x1;
      const by = (1 - u) ** 3 * y0 + 3 * (1 - u) ** 2 * u * y0 + 3 * (1 - u) * u * u * y1 + u ** 3 * y1;
      pts.push([bx, by]);
    }
    ctx.beginPath();
    const upto = Math.floor(steps * lineK);
    for (let s = 0; s <= upto; s++) s === 0 ? ctx.moveTo(pts[s][0], pts[s][1]) : ctx.lineTo(pts[s][0], pts[s][1]);
    ctx.stroke(); ctx.restore();
  }

  // the answer
  const ansK = easeRise(prog(t, B.answerA, B.answerB));
  if (ansK > 0) {
    const a = ANSWER;
    ctx.save();
    ctx.globalAlpha = layerA * ansK;
    ctx.translate(0, (1 - ansK) * 60);
    rr(ctx, a.x, a.y, a.w, a.h, 28);
    ctx.fillStyle = "#f5f3ee"; ctx.fill();
    ctx.fillStyle = "#111317"; ctx.font = "500 38px Figtree"; ctx.textAlign = "left";
    ctx.fillText("Yes, Saturday mornings", a.x + 34, a.y + 66);
    ctx.fillText("in the city.", a.x + 34, a.y + 112);
    ctx.fillStyle = COBALT; ctx.font = "400 24px FMono";
    ctx.fillText("Source · Delivery page", a.x + 34, a.y + 160);
    ctx.restore();
    monoLabel(ctx, "// Answered from your site", W / 2, a.y + a.h + 56, ansK * layerA, "rgba(255,255,255,0.6)", "center");
  }
  ctx.restore();

  // fold ripple
  const rip = prog(t, B.foldB - 0.25, B.foldB + 0.7);
  if (rip > 0 && rip < 1) {
    for (let i = 0; i < 2; i++) {
      const k = clamp(rip - i * 0.18, 0, 1);
      if (k <= 0) continue;
      ctx.strokeStyle = `rgba(61,155,255,${0.6 * (1 - k)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(CX, CY, lerp(LENS_R, 300, easeOut(k)), 0, Math.PI * 2); ctx.stroke();
    }
  }

  // the lens, always on top; it blinks once while thinking (scan)
  const blink = Math.max(0, 1 - Math.abs((t - 4.2) / 0.07));
  ctx.save();
  if (blink > 0) { ctx.translate(lx, ly); ctx.scale(1, 1 - 0.85 * blink); ctx.translate(-lx, -ly); }
  lens(ctx, lx, ly, lr, 1);
  ctx.restore();

  finish(ctx, t);
}

// vignette + fine grain (deterministic per frame, so the loop repeats exactly)
let noise;
function finish(ctx, t) {
  const v = ctx.createRadialGradient(CX, CY, H * 0.35, CX, CY, H * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (!noise) {
    noise = document.createElement("canvas"); noise.width = 256; noise.height = 256;
    const n = noise.getContext("2d"), d = n.createImageData(256, 256);
    let s = 1234567;
    for (let i = 0; i < d.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const g = s % 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = g; d.data[i + 3] = 14; }
    n.putImageData(d, 0, 0);
  }
  const f = Math.floor(t * 30);
  ctx.save(); ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = ctx.createPattern(noise, "repeat");
  ctx.translate((f * 73) % 256, (f * 151) % 256);
  ctx.fillRect(-256, -256, W + 512, H + 512);
  ctx.restore();
}

// ── frame API for the renderer ──
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const acc = document.createElement("canvas"); acc.width = W; acc.height = H;
const actx = acc.getContext("2d");
window.ready = Promise.all([
  document.fonts.load("400 20px Figtree"), document.fonts.load("500 20px Figtree"),
  document.fonts.load("600 20px Figtree"), document.fonts.load("400 20px FMono"),
]);
/* Motion blur: average `samples` sub-frames over a 180° shutter. */
window.renderFrame = (f, fps = 30, samples = 3) => {
  actx.clearRect(0, 0, W, H);
  for (let i = 0; i < samples; i++) {
    const t = (f + (i / samples) * 0.5) / fps;
    render(ctx, t);
    actx.globalAlpha = 1 / (i + 1);
    actx.drawImage(canvas, 0, 0);
  }
  actx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H); ctx.drawImage(acc, 0, 0);
};
window.ready.then(() => { render(ctx, 0); document.title = "ready"; });
</script>
</body>
</html>
